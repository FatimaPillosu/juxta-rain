<svg xmlns="http://www.w3.org/2000/svg" viewBox="175 84 642 380">
  <title>JUXTA RAIN Logo</title>
  <defs>
    <!-- Clip path for the perspective topographic map -->
    <clipPath id="map-clip">
      <polygon points="374,336 505,336 505,452 341,452" />
    </clipPath>

    <!-- Uniform raindrop symbols (Left Cyan #32B5E8 / Right Purple #B37CE2) -->
    <g id="raindrop-left">
      <path d="M 0,-7 C 2,-2 4.5,1.5 4.5,4.2 C 4.5,6.8 2.5,8.8 0,8.8 C -2.5,8.8 -4.5,6.8 -4.5,4.2 C -4.5,1.5 -2,-2 0,-7 Z" fill="#32B5E8" />
    </g>
    <g id="raindrop-right">
      <path d="M 0,-7 C 2,-2 4.5,1.5 4.5,4.2 C 4.5,6.8 2.5,8.8 0,8.8 C -2.5,8.8 -4.5,6.8 -4.5,4.2 C -4.5,1.5 -2,-2 0,-7 Z" fill="#B37CE2" />
    </g>
  </defs>

  <!-- ========================================== -->
  <!-- 1. TOPOGRAPHIC MAP (BOTTOM LEFT)           -->
  <!-- ========================================== -->
  <g id="topographic-map">
    <g clip-path="url(#map-clip)">
      <!-- Base dark slate-teal layer -->
      <rect x="335" y="330" width="175" height="130" fill="#1F3647" />

      <!-- Elevation Layer 1: Deep Teal -->
      <path d="M 335,440 C 365,425 360,385 380,365 C 400,345 425,330 455,330 L 510,330 L 510,455 L 335,455 Z" fill="#2B6777" />

      <!-- Elevation Layer 2: Mid Sea-Teal -->
      <path d="M 345,455 C 355,425 370,415 378,390 C 386,365 408,350 435,330 L 502,330 C 488,365 460,385 450,415 C 440,440 410,450 390,455 Z" fill="#3B8EA5" />

      <!-- Elevation Layer 3: Mint-Turquoise -->
      <path d="M 358,450 C 362,422 382,412 388,388 C 394,364 418,348 442,332 L 488,332 C 472,360 448,376 436,405 C 425,432 392,448 358,450 Z" fill="#56B8A8" />

      <!-- Elevation Layer 4: Light Mint Green -->
      <path d="M 370,432 C 374,410 392,400 398,380 C 404,360 426,346 448,334 L 476,334 C 462,356 440,372 428,396 C 416,420 384,436 370,432 Z" fill="#7FD8A6" />

      <!-- Elevation Layer 5: Lime Green -->
      <path d="M 382,416 C 386,398 402,390 408,374 C 414,358 434,344 452,335 L 468,335 C 455,352 436,368 422,390 C 410,408 390,420 382,416 Z" fill="#B5E684" />

      <!-- Elevation Layer 6: Peak Ridge Yellow -->
      <path d="M 394,400 C 400,386 414,376 422,362 C 430,348 444,340 456,336 C 460,342 444,360 430,376 C 416,392 400,404 394,400 Z" fill="#EAE86F" />

      <!-- Subtle River / Tributary Lines in Lower Right -->
      <path d="M 428,452 C 435,436 452,430 462,418 C 474,404 490,408 505,398" fill="none" stroke="#1B2836" stroke-width="2" stroke-linecap="round" />
      <path d="M 462,418 C 472,428 486,432 502,442" fill="none" stroke="#1B2836" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Trapezoid Map Border -->
    <polygon points="374,336 505,336 505,452 341,452" fill="none" stroke="#68C3C8" stroke-width="3.2" stroke-linejoin="round" />

    <!-- Map Location Pin -->
    <g id="map-pin">
      <path d="M 406,395 C 406,395 391,377 391,366 C 391,357.7 397.7,351 406,351 C 414.3,351 421,357.7 421,366 C 421,377 406,395 406,395 Z" fill="#EAE86F" stroke="#222B38" stroke-width="3.8" stroke-linejoin="round" />
      <circle cx="406" cy="366" r="5.5" fill="#222B38" />
      <circle cx="406" cy="366" r="2.5" fill="#EAE86F" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 2. CLOUDS (TOP CENTER)                     -->
  <!-- ========================================== -->
  <g id="clouds">
    <!-- Right Purple Cloud (Back) -->
    <g id="purple-cloud">
      <path d="M 497,191 L 545,138 L 608,138 L 623,164 C 646,162 664,174 664,191 Z" fill="#B37CE2" />
      <path d="M 497,191 L 545,138 L 586,138 L 538,191 Z" fill="#8D67CA" />
      <line x1="497" y1="191" x2="664" y2="191" stroke="#C596EC" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Left Mint/Teal Cloud (Front) -->
    <g id="mint-cloud">
      <path d="M 353,160 L 373,137 L 386,137 L 408,114 L 431,114 L 448,91 L 496,91 L 515,117 C 546,115 566,135 566,160 Z" fill="none" stroke="#222B38" stroke-width="5" stroke-linejoin="round" />
      <path d="M 353,160 L 373,137 L 386,137 L 408,114 L 431,114 L 448,91 L 496,91 L 515,117 L 471,160 Z" fill="#6FE3C4" />
      <path d="M 471,160 L 515,117 C 546,115 566,135 566,160 Z" fill="#58B9B9" />
      <line x1="353" y1="160" x2="566" y2="160" stroke="#79EBD0" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. UNIFORM RAIN TRACKS & DROPS (CENTER)    -->
  <!-- ========================================== -->
  <g id="rain-system">
    <!-- Left Rain: Uniform Dashed Rain Columns Under Green/Mint Cloud (y1="170", Cyan #32B5E8) -->
    <g id="rain-left-lines" stroke="#32B5E8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="7 7">
      <line x1="397" y1="170" x2="397" y2="230" />
      <line x1="413" y1="170" x2="413" y2="256" />
      <line x1="429" y1="170" x2="429" y2="284" />
      <line x1="445" y1="170" x2="445" y2="268" />
      <line x1="460" y1="170" x2="460" y2="300" />
      <line x1="474" y1="170" x2="474" y2="262" />
      <line x1="487" y1="170" x2="487" y2="288" />
    </g>

    <!-- Left Rain: Uniform Raindrops Under Green/Mint Cloud -->
    <g id="rain-left-drops">
      <use href="#raindrop-left" x="397" y="244" />
      <use href="#raindrop-left" x="413" y="270" />
      <use href="#raindrop-left" x="429" y="298" />
      <use href="#raindrop-left" x="445" y="282" />
      <use href="#raindrop-left" x="460" y="314" />
      <use href="#raindrop-left" x="474" y="276" />
      <use href="#raindrop-left" x="487" y="302" />
    </g>

    <!-- Right Rain: Uniform Dashed Rain Columns Under Purple Cloud (y1="200", Purple #B37CE2) -->
    <g id="rain-right-lines" stroke="#B37CE2" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="7 7">
      <line x1="500" y1="200" x2="500" y2="304" />
      <line x1="513" y1="200" x2="513" y2="238" />
      <line x1="527" y1="200" x2="527" y2="265" />
      <line x1="542" y1="200" x2="542" y2="235" />
      <line x1="557" y1="200" x2="557" y2="252" />
      <line x1="571" y1="200" x2="571" y2="238" />
      <line x1="585" y1="200" x2="585" y2="255" />
      <line x1="599" y1="200" x2="599" y2="232" />
      <line x1="613" y1="200" x2="613" y2="244" />
      <line x1="627" y1="200" x2="627" y2="230" />
    </g>

    <!-- Right Rain: Uniform Raindrops Under Purple Cloud -->
    <g id="rain-right-drops">
      <use href="#raindrop-right" x="500" y="318" />
      <use href="#raindrop-right" x="513" y="252" />
      <use href="#raindrop-right" x="527" y="279" />
      <use href="#raindrop-right" x="542" y="249" />
      <use href="#raindrop-right" x="557" y="266" />
      <use href="#raindrop-right" x="571" y="252" />
      <use href="#raindrop-right" x="585" y="269" />
      <use href="#raindrop-right" x="599" y="246" />
      <use href="#raindrop-right" x="613" y="258" />
      <use href="#raindrop-right" x="627" y="244" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 4. STACKED BAR CHART (BOTTOM RIGHT)        -->
  <!-- ========================================== -->
  <g id="ledger-chart">
    <!-- Horizontal Reference Grid Lines -->
    <line x1="522" y1="312" x2="633" y2="312" stroke="#EBDC54" stroke-width="2.6" stroke-linecap="round" />
    <line x1="522" y1="355" x2="633" y2="355" stroke="#E598B2" stroke-width="2.6" stroke-linecap="round" />
    <line x1="522" y1="398" x2="633" y2="398" stroke="#E598B2" stroke-width="2.6" stroke-linecap="round" />

    <!-- Right-Side Vertical Stems & Nodes -->
    <line x1="599" y1="274" x2="599" y2="443" stroke="#EBDC54" stroke-width="2.6" />
    <circle cx="599" cy="274" r="4.8" fill="#EBDC54" />

    <line x1="633" y1="259" x2="633" y2="443" stroke="#F299B6" stroke-width="3" />
    <circle cx="633" cy="259" r="5.5" fill="#F299B6" />

    <!-- Right Axis Tick Marks -->
    <line x1="609" y1="335" x2="633" y2="335" stroke="#F299B6" stroke-width="2.6" stroke-linecap="round" />

    <!-- Bar 1 (x = 522) -->
    <rect x="522" y="366" width="19" height="31" fill="#EBDC54" />
    <rect x="522" y="397" width="19" height="5" fill="#E0759B" />
    <rect x="522" y="402" width="19" height="41" fill="#F299B6" />

    <!-- Bar 2 (x = 550) -->
    <rect x="550" y="303" width="19" height="69" fill="#EBDC54" />
    <rect x="550" y="372" width="19" height="14" fill="#E0759B" />
    <rect x="550" y="386" width="19" height="57" fill="#F299B6" />

    <!-- Bar 3 (x = 579) -->
    <rect x="579" y="356" width="19" height="29" fill="#EBDC54" />
    <rect x="579" y="385" width="19" height="15" fill="#E0759B" />
    <rect x="579" y="400" width="19" height="43" fill="#F299B6" />

    <!-- Bar 4 (x = 611) -->
    <rect x="611" y="360" width="20" height="16" fill="#EBDC54" />
    <rect x="611" y="376" width="20" height="67" fill="#F299B6" />

    <!-- Bottom Baseline -->
    <line x1="521" y1="452" x2="642" y2="452" stroke="#F299B6" stroke-width="3.6" stroke-linecap="round" />
  </g>
  <!-- ========================================== -->
  <!-- 5. VECTOR TYPOGRAPHY: "JUXTA" & "RAIN"     -->
  <!-- ========================================== -->
  <g id="typography" fill-rule="evenodd">
    <!-- LEFT WORD: "JUXTA" -->
    <g id="word-juxta" fill="#52CBD4">
      <!-- J -->
      <path d="M 203,260 L 214,260 L 214,298 C 214,311.5 207,319 195.5,319 C 186.5,319 180.5,314 179,304.5 L 189.5,302.5 C 190.5,307 192.5,309 195.5,309 C 200.5,309 203,305.5 203,298 Z" />
      <!-- U -->
      <path d="M 224,260 L 235,260 L 235,296 C 235,304.5 238.5,308.5 244,308.5 C 249.5,308.5 253,304.5 253,296 L 253,260 L 264,260 L 264,296.5 C 264,311 256.5,319 244,319 C 231.5,319 224,311 224,296.5 Z" />
      <!-- X -->
      <path d="M 274,260 L 286.5,260 L 295,279 L 303.5,260 L 316,260 L 301.5,288.5 L 317,318 L 304.5,318 L 295,298 L 285.5,318 L 273,318 L 288.5,288.5 Z" />
      <!-- T -->
      <path d="M 322,260 L 362,260 L 362,270.5 L 347.5,270.5 L 347.5,318 L 336.5,318 L 336.5,270.5 L 322,270.5 Z" />
      <!-- A -->
      <path d="M 366,318 L 382,260 L 392,260 L 408,318 L 396.5,318 L 393,304 L 381,304 L 377.5,318 Z M 383.5,294 L 390.5,294 L 387,274 Z" />
    </g>

    <!-- RIGHT WORD: "RAIN" -->
    <g id="word-rain" fill="#B37CE2">
      <!-- R -->
      <path d="M 652,318 L 652,260 L 672.5,260 C 684.5,260 691,266 691,277 C 691,284.5 687,290 680,292.5 L 693,318 L 680.5,318 L 669,294 L 663,294 L 663,318 Z M 663,270 L 663,284.5 L 671.5,284.5 C 677.5,284.5 680,281.8 680,277.2 C 680,272.6 677.5,270 671.5,270 Z" />
      <!-- A -->
      <path d="M 699,318 L 715,260 L 725,260 L 741,318 L 729.5,318 L 726,304 L 714,304 L 710.5,318 Z M 716.5,294 L 723.5,294 L 720,274 Z" />
      <!-- I -->
      <path d="M 750,260 L 761,260 L 761,318 L 750,318 Z" />
      <!-- N -->
      <path d="M 773,318 L 773,260 L 784,260 L 802.5,298 L 802.5,260 L 813,260 L 813,318 L 802.5,318 L 783.5,279 L 783.5,318 Z" />
    </g>
  </g>
</svg>